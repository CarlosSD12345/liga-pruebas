<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liga Veteranos Vallès</title>
    <style>
      :root {
        --bg: #0b1d15;
        --panel: #11291e;
        --panel-alt: #173827;
        --panel-soft: #1d4334;
        --border: #1f4733;
        --green: #2ecc71;
        --green-strong: #22b15d;
        --green-soft: #dff9eb;
        --text: #edf7ef;
        --muted: #a3b8af;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }

      header {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }

      .header-logo {
        width: 400px;
        max-width: 100%;
        height: auto;
        display: block;
      }

      .tabs-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        flex: 1;
      }

      .tab-btn {
        background-color: var(--panel);
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        white-space: nowrap;
        transition: 0.2s ease;
      }

      .tab-btn.active {
        background-color: var(--green);
        color: var(--bg);
        border-color: var(--green);
      }

      .tab-btn.actas-btn {
        background: linear-gradient(180deg, #1f6b50 0%, #0f4739 100%);
        color: #ebfff7;
        border-color: #37d68a;
        box-shadow: 0 0 0 1px rgba(55, 214, 138, 0.2);
      }

      .tab-btn:hover {
        filter: brightness(1.08);
      }

      .badge {
        background-color: var(--green);
        color: var(--bg);
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: bold;
        display: inline-block;
        white-space: nowrap;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-top: 14px;
      }

      .fixture {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-top: 1px solid var(--border);
        padding: 16px 0;
      }

      .fixture:first-child {
        border-top: none;
        padding-top: 0;
      }

      .team-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      .team-wrap.right {
        justify-content: flex-end;
      }

      .team-logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #ffffff;
        color: #0b1d15;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1rem;
        flex-shrink: 0;
      }

      .team-name {
        font-weight: 700;
        color: white;
      }

      .score-box {
        min-width: 110px;
        text-align: center;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--green);
      }

      .meta {
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 8px;
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 700px) {
        body { padding: 12px; }
        .tabs-row {
          align-items: flex-start;
        }
        .badge {
          width: 100%;
          text-align: center;
        }
        .fixture {
          flex-wrap: wrap;
          justify-content: center;
        }
        .team-wrap, .team-wrap.right {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="header-logo" src="escudos/logo_liga.png" alt="Liga Veteranos Vallès" onerror="this.style.display='none'" />
      </header>

      <div class="tabs-row">
        <div class="tabs" aria-label="Secciones de la liga">
          <button class="tab-btn active" type="button">Calendario</button>
          <button class="tab-btn" type="button">Fair Play</button>
          <button class="tab-btn" type="button">Clasificación</button>
          <button class="tab-btn" type="button">Árbitros</button>
          <button class="tab-btn" type="button">Goleadores</button>
          <button class="tab-btn" type="button">Acceso Delegados</button>
          <button class="tab-btn actas-btn" type="button">Actas</button>
        </div>
        <div class="badge">JORNADA 7</div>
      </div>

      <div class="panel">
        <div class="fixture">
          <div class="team-wrap">
            <div class="team-logo">P</div>
            <div class="team-name">Pallejà</div>
          </div>
          <div class="score-box">4 - 2</div>
          <div class="team-wrap right">
            <div class="team-name">Canovelles</div>
            <div class="team-logo">C</div>
          </div>
        </div>

        <div class="meta">MPAL PALLEJA · 08:15 · 01/11/2026</div>

        <div class="fixture">
          <div class="team-wrap">
            <div class="team-logo">A</div>
            <div class="team-name">L'Ametlla</div>
          </div>
          <div class="score-box">3 - 1</div>
          <div class="team-wrap right">
            <div class="team-name">Palau Plegamans</div>
            <div class="team-logo">P</div>
          </div>
        </div>

        <div class="meta">MPAL L'AMETLLA · 08:30 · 01/11/2026</div>

        <div class="fixture">
          <div class="team-wrap">
            <div class="team-logo">R</div>
            <div class="team-name">VCF Ripollet</div>
          </div>
          <div class="score-box">3 - 1</div>
          <div class="team-wrap right">
            <div class="team-name">Sant Feliu</div>
            <div class="team-logo">S</div>
          </div>
        </div>

        <div class="meta">MPAL RIPOLLET · 08:00 · 01/11/2026</div>
      </div>

      <div class="footer">Liga Veteranos Vallès</div>
    </div>
  </body>
</html>
